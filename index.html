<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetropolis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <div class="board-wrap">
      <canvas id="board" width="340" height="612"></canvas>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <h2 id="overlay-title">Paused</h2>
          <p id="overlay-text"></p>
          <div class="overlay-actions">
            <button id="overlay-btn" type="button">Restart</button>
            <button id="overlay-study-btn" class="btn-ghost open-study" type="button">Study</button>
          </div>
        </div>
      </div>

      <div id="study" class="study hidden" role="dialog" aria-modal="true" aria-label="Study the world of Tetropolis">
        <div class="study-panel">
          <header class="study-top">
            <h2>Study the World</h2>
            <div class="study-actions">
              <button id="study-quiz-btn" class="btn-ghost" type="button" aria-pressed="false">Quiz: off</button>
              <button id="study-back" type="button">Back</button>
            </div>
          </header>
          <p id="study-hint" class="study-hint"></p>
          <div id="study-body" class="study-body browse"></div>
        </div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="side-head">
        <h1>Tetropolis</h1>
        <button id="mute-btn" class="mute-btn" type="button" aria-label="Mute music" aria-pressed="false" title="Mute music (M)">🔊</button>
      </div>
      <p class="tagline">Tetris, but the blocks are cities. Group cities into countries, countries into continents.</p>

      <div class="stats">
        <div class="stat"><span>Score</span><b id="score">0</b></div>
        <div class="stat"><span>Level</span><b id="level">1</b></div>
        <div class="stat"><span>Lines</span><b id="lines">0</b></div>
      </div>

      <div class="next">
        <span class="label">Next</span>
        <canvas id="next" width="136" height="136"></canvas>
      </div>

      <div class="controls">
        <span class="label">Controls</span>
        <table>
          <tbody>
            <tr><td><span>←</span> <span>→</span></td><td>Move</td></tr>
            <tr><td><span>↑</span> <span>X</span></td><td>Rotate</td></tr>
            <tr><td><span>↓</span></td><td>Soft drop</td></tr>
            <tr><td><span>Space</span></td><td>Hard drop</td></tr>
            <tr><td><span>P</span></td><td>Pause</td></tr>
            <tr><td><span>R</span></td><td>Restart</td></tr>
            <tr><td><span>M</span></td><td>Mute music</td></tr>
          </tbody>
        </table>
      </div>

      <div class="legend">
        <span class="label">Continents</span>
        <div id="legend"></div>
      </div>
    </aside>
  </main>

  <script src="music.js"></script>
  <script src="game.js"></script>
  <script src="study.js"></script>
</body>
</html>
